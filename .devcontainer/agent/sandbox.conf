# Workspace-specific layout of the coding-agent sandbox.
# See ADR-0010 (trust model) and ADR-0011 (agent-owned clones) in hojt/homelab.
#
# Sourced by agent.sh on the host. Keep this file to plain variable and
# array assignments. Anything declared here must match the mounts in
# .devcontainer/agent/devcontainer.json; agent.sh verifies that it does
# before starting an agent.

# How the agent gets its workspace:
#
#   clone  The agent works in its own clone, cloned from this repository's
#          .git mounted read-only. The developer's working tree is not
#          mounted. Agent work is delivered as branches. (ADR-0011)
#
#   mount  The developer's working tree is mounted read-only, with selected
#          paths made writable, protected, isolated, or hidden through the
#          lists below. (ADR-0010)
agent_workspace_mode=clone

# The lists below mainly apply to the mount mode. In the clone mode the
# whole workspace belongs to the agent, so they are normally left empty.
# Paths are relative to the workspace unless they start with /.
#
# Sibling repositories mounted read-only under repos/<name>:
#   workspace_repositories=()
#
# Paths the agent may write to:
#   agent_writable_paths=()
#
# Paths that are read-only in addition to the baseline in agent.sh:
#   agent_protected_paths=()
#
# Agent-only mounts, such as caches and build output:
#   agent_isolated_paths=()
#
# Paths hidden behind empty mounts, such as local key material:
#   agent_hidden_paths=()
