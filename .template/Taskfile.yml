version: '3'

tasks:
  update:
    desc: Merge a template version into this workspace (task template:update -- <version>)
    cmds:
      - .template/update.sh {{.CLI_ARGS}}

  status:
    desc: Show the template versions this workspace started from and merged
    cmds:
      - "git log -E --date=short --format='%h %ad %s' --grep='^chore\\(template\\): (start from|update to) '"
